<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATR Brostería Chancay | Carta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="site-header">
        <div class="logo">
            <img src="/assets/img/logo-atr.jpg" alt="Logo ATR Brostería" width="60">
            <h1>ATR Brostería</h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="carta.html" class="activo">Carta</a></li>
                <li><a href="promociones.html">Promociones</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="galeria-carta">
            <h2>Nuestros favoritos</h2>
            <div class="grid-carta">
                <figure class="producto">
                    <img src="assets/img/pollo-broaster.jpg"
                        alt="Porción de pollo broaster dorado con guarnición de papas" width="320" height="240"
                        loading="lazy">
                    <figcaption>Pollo Broaster (1/4) — S/ 14.00</figcaption>
                </figure>

                <figure class="producto">
                    <img src="assets/img/combo-familiar.jpg" alt="Combo familiar con pollo, papas grandes y cremas"
                        width="320" height="240" loading="lazy">
                    <figcaption>Combo Familiar — S/ 45.00</figcaption>
                </figure>

                <figure class="producto">
                    <img src="assets/img/papas-fritas.jpg" alt="Papas fritas crujientes en porción individual"
                        width="320" height="240" loading="lazy">
                    <figcaption>Papas Fritas (porción) — S/ 6.00</figcaption>
                </figure>

                <figure class="producto">
                    <img src="assets/img/c4.png" alt="Nuggets de pollo" width="320" height="240" loading="lazy">
                    <figcaption>Nuggets de pollo — S/ 14.00</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 ATR Brostería — Chancay, Huaral, Lima.</p>
        <p>Tel. 999 888 777 | Av. Pacífico 245, Chancay</p>
    </footer>
</body>

</html>
